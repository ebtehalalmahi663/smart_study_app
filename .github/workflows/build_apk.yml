name: Build Flutter APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # 1. إعادة إنشاء مجلد android المتوافق تماماً مع Flutter الحديث
      - name: Re-create Android Platform Files
        run: flutter create --platforms=android .

      # 2. تعديل compileSdk إلى 36 تلقائياً
      - name: Set compileSdk to 36
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 36/' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug
