name: Build Flutter APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install dependencies
        run: flutter pub get

      # هذه هي الخطوة السحرية التي ستحل مشكلة compileSdk
      - name: Fix compileSdk Version
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 36/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --debug
